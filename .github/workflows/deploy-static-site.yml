name: Build and Deploy Static Site
on:
  push:
    tags:
      - "*"
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: deploy-solitare
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  S3_BUCKET_NAME: "solitare-us-east-1-504242000181"
  AWS_REGION: "us-east-1"
  SITE_URL: "https://solitare.2ad.com"
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          audience: sts.amazonaws.com
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: arn:aws:iam::504242000181:role/GithubDeployCI
      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install Node dependencies
        run: bun install --frozen-lockfile
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Install Trunk and Wasm
        run: |
          if ! command -v trunk >/dev/null 2>&1; then
            cargo install trunk --locked
          fi

          if ! command -v wasm-bindgen >/dev/null 2>&1; then
            cargo install wasm-bindgen-cli --locked
          fi

          trunk --version
          wasm-bindgen --version
      - name: Rust Build and Check
        run: |
          cargo fmt --check
          cargo clippy --all-features --all-targets --no-deps -- -D warnings
          cargo test --release
      - name: Build Artifact
        run: |
          trunk build --release --public-url ${{ env.SITE_URL }}
      - name: Typecheck
        run: bun run build
      - name: Run CDK stack tests
        run: bun run test
      - name: Deploy infrastructure
        run: |
          bun run cdk:deploy -- StackSolitare2adCom --require-approval never --no-telemetry --outputs-file cdk-outputs.json
      - name: Sync S3 Bucket
        run: |
          aws s3 sync ./dist s3://${S3_BUCKET_NAME} --delete --region ${{ env.AWS_REGION }}
      - name: Set HTML no-cache headers
        run: |
          aws s3 cp ./dist/index.html s3://${S3_BUCKET_NAME}/index.html \
            --region ${{ env.AWS_REGION }} \
            --cache-control "no-cache, no-store, must-revalidate" \
            --content-type "text/html; charset=utf-8"
      - name: Invalidate CloudFront cache
        run: |
          DISTRIBUTION_ID="$(jq -r '.StackSolitare2adCom.DistributionId // empty' cdk-outputs.json)"
          if [[ -z "$DISTRIBUTION_ID" ]]; then
            echo "Missing DistributionId output for StackSolitare2adCom" >&2
            exit 1
          fi
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"
      - name: GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: false
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
